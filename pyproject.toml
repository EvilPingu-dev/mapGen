[project]
name = "mapgen"
version = "0.1.0"
description = "Tribal Wars map tool - split tribes, detect families, generate interactive SVG maps"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
mapgen = "mapgen.cli:main"
mapgen-web = "webapp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mapgen"]
include = ["webapp.py"]
